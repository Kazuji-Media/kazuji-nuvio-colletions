name: Premiações · gerar e publicar prova

on:
  push:
    branches: [main, feat/premiacoes-prova]
    paths:
      - catalogos/premiacoes/**
      - scripts/build_premiacoes.py
      - tests/test_premiacoes.py
      - .github/workflows/premiacoes.yml
  pull_request:
    paths:
      - catalogos/premiacoes/**
      - scripts/build_premiacoes.py
      - tests/test_premiacoes.py
      - .github/workflows/premiacoes.yml
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read

concurrency:
  group: premiacoes-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validar comportamento dos catálogos
        run: python -m unittest discover -s tests -p 'test_premiacoes.py' -v
      - name: Gerar arquivos estáticos
        run: python scripts/build_premiacoes.py
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: .build/premiacoes

  deploy:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/premiacoes-prova')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar catálogo
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
